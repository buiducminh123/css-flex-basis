<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-basis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Thuộc tính flex-basis</h1>

    <h2>Ví dụ 1: flex-basis với px</h2>
    <div class="container ex1">
        <div class="item a">Item 1 (200px)</div>
        <div class="item b">Item 2 (100px)</div>
        <div class="item c">Item 3 (150px)</div>
    </div>

    <h2>Ví dụ 2: flex-direction: column</h2>
    <div class="container ex2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h2>Ví dụ 3: flex-basis với %</h2>
    <div class="container ex3">
        <div class="item">Item 1 (50%)</div>
        <div class="item">Item 2 (50%)</div>
    </div>

    <h2>Ví dụ 4: flex-basis + flex-grow</h2>
    <div class="container ex4">
        <div class="item a">Item 1 (grow 1)</div>
        <div class="item b">Item 2 (grow 2)</div>
        <div class="item c">Item 3 (grow 1)</div>
    </div>
</body>

</html>
